# Deal Scanner — example config
#
# Copy to `config.yaml` and edit. `config.yaml` is gitignored.

# Default poll interval per product, in seconds. Keep this generous —
# retailers rate-limit aggressively and excessive polling will get you blocked
# (and is rude). 5–15 minutes is reasonable.
default_poll_interval_seconds: 600

# Maximum acceptable markup over MSRP, as a percentage. 10 means "alert if
# price <= MSRP * 1.10". Can be overridden per product or per watch_drops entry.
default_max_markup_pct: 10.0

# Identify yourself in the User-Agent. Some sites are friendlier when they
# can see who's hitting them.
user_agent: "DealScannerBot/0.1 (+contact: you@example.com)"

# Respect robots.txt (recommended). If a retailer disallows the product URL
# in robots.txt, the scanner will skip it.
respect_robots_txt: true

# Where to persist alert-state (so you don't get re-notified every cycle).
state_file: state.json

# Notifications — set one or both. Both are pull-style services that don't
# require API keys baked into source.
notifiers:
  # Discord: Server Settings → Integrations → Webhooks → New Webhook → Copy URL
  discord_webhook_url: null
  # ntfy: subscribe to a topic at https://ntfy.sh (or self-host). Push URL is
  # https://ntfy.sh/<your-topic>. Subscribe on phone/desktop to receive.
  ntfy_topic_url: null

# ─── Drop calendar (aggregated) ──────────────────────────────────────────────
#
# Local YAML files with drop entries. See drops.example.yaml for the schema.
drops_files:
  - drops.yaml

# Remote YAML or JSON drop sources. Each URL should return the same schema as
# drops.yaml (top-level `drops:` list). Useful for subscribing to a friend's
# or community-curated calendar. Later sources override earlier ones on slug
# collision; `drops_files` are loaded before `drops_urls`.
drops_urls: []
  # - https://raw.githubusercontent.com/some-user/pokemon-drops/main/drops.yaml

# Auto-watch products from the drop calendar. Each entry expands into one
# Product per retailer link in that drop, so a single drop with four
# retailer URLs is watched at all four retailers automatically.
watch_drops: []
  # - slug: example-booster-box
  #   max_markup_pct: 5
  # - slug: example-elite-trainer-box
  #   retailers: [pokemoncenter, target]   # subset; omit to watch all

# ─── Manually watched products ───────────────────────────────────────────────
#
# Anything listed here is watched in addition to `watch_drops`. Set
# `drop_slug` to enable cross-retailer "Also try:" links in alerts.
products: []
  # - name: "Surging Sparks Booster Box @ pokemoncenter"
  #   url: "https://www.pokemoncenter.com/product/REPLACE"
  #   msrp: 161.64
  #   drop_slug: example-booster-box
  #   max_markup_pct: 5

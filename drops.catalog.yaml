# Pokémon TCG drop catalog — seeded with Scarlet & Violet era sets.
#
# Honest caveat: this is a starter catalog of sets the project author was
# confident about. Pokémon releases new sets every 6-8 weeks; verify any
# upcoming dates and add new sets with:
#
#     deal-scanner discover "Set Name Booster Box" --yaml \
#         --msrp 161.64 --release-date 2026-MM-DD
#
# Link targets are retailer SEARCH URLs (e.g. target.com/s?searchTerm=...)
# rather than specific product SKUs. Reasoning: SKU URLs rot when retailers
# rotate inventory, but search URLs always resolve to the right results page
# — one tap and you're at the buy page. If you want real-time restock
# monitoring for a specific SKU, replace its link with the product-detail
# URL (the JSON-LD scraper needs a PDP, not a search results page).
#
# Standard Pokémon TCG MSRPs (stable for years):
#   Booster pack          $4.49
#   Booster bundle (6×)   $26.99
#   Booster box (36×)    $161.64
#   Elite Trainer Box     $49.99
#   Build & Battle Box    $22.99
#   Premium Collection    $24.99
#   Ultra-Premium Coll.  $119.99
#   Tin (standard)        $24.99

